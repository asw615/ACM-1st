<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="740" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="320" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#222" letter-spacing="0.3">Win-Stay, Lose-Switch (WSLS) Model</text>

  <!-- ===== FIRST TRIAL (pill) ===== -->
  <rect x="195" y="56" width="250" height="40" rx="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
  <text x="320" y="74" text-anchor="middle" font-size="11.5" fill="#444">First trial: choose randomly</text>
  <text x="320" y="88" text-anchor="middle" font-size="10" fill="#888" font-style="italic">p = 0.5</text>

  <!-- Arrow down -->
  <line x1="320" y1="96" x2="320" y2="126" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ===== TRIAL t-1 OUTCOME ===== -->
  <rect x="195" y="130" width="250" height="40" rx="5" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="320" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Trial t−1 outcome</text>

  <!-- ===== WIN BRANCH (left) ===== -->
  <line x1="240" y1="170" x2="160" y2="220" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="175" y="191" text-anchor="end" font-size="11" fill="#2e7d32" font-weight="600">Win</text>
  <text x="175" y="205" text-anchor="end" font-size="10" fill="#666" font-style="italic">rₜ₋₁ = 1</text>

  <!-- ===== LOSS BRANCH (right) ===== -->
  <line x1="400" y1="170" x2="480" y2="220" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="465" y="191" text-anchor="start" font-size="11" fill="#c0392b" font-weight="600">Loss</text>
  <text x="465" y="205" text-anchor="start" font-size="10" fill="#666" font-style="italic">rₜ₋₁ = 0</text>

  <!-- ===== STAY BOX (left) ===== -->
  <rect x="35" y="226" width="250" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.2"/>
  <text x="160" y="248" text-anchor="middle" font-size="12" fill="#222" font-weight="500">Stay with same choice</text>
  <text x="160" y="265" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">P(yₜ = yₜ₋₁) = (1−ε)·1 + ε/2</text>

  <!-- ===== SWITCH BOX (right) ===== -->
  <rect x="355" y="226" width="250" height="50" rx="5" fill="#ffebee" stroke="#e57373" stroke-width="1.2"/>
  <text x="480" y="248" text-anchor="middle" font-size="12" fill="#222" font-weight="500">Switch to other choice</text>
  <text x="480" y="265" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">P(yₜ = yₜ₋₁) = (1−ε)·0 + ε/2</text>

  <!-- ===== ARROWS DOWN from Stay/Switch to result boxes ===== -->
  <line x1="160" y1="276" x2="160" y2="310" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="480" y1="276" x2="480" y2="310" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ===== PROBABILITY RESULT BOXES ===== -->
  <rect x="70" y="316" width="180" height="36" rx="4" fill="#fff" stroke="#4caf50" stroke-width="1"/>
  <text x="160" y="339" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="500">= 1 − ε/2</text>

  <rect x="390" y="316" width="180" height="36" rx="4" fill="#fff" stroke="#e57373" stroke-width="1"/>
  <text x="480" y="339" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="500">= ε/2</text>

  <!-- ===== CONVERGENCE: result boxes → final choice ===== -->
  <!-- Left path: down from result, then right to center -->
  <line x1="160" y1="352" x2="160" y2="498" stroke="#333" stroke-width="1.2"/>
  <line x1="160" y1="498" x2="280" y2="498" stroke="#333" stroke-width="1.2"/>

  <!-- Right path: down from result, then left to center -->
  <line x1="480" y1="352" x2="480" y2="498" stroke="#333" stroke-width="1.2"/>
  <line x1="480" y1="498" x2="360" y2="498" stroke="#333" stroke-width="1.2"/>

  <!-- Arrow down from convergence -->
  <line x1="320" y1="498" x2="320" y2="530" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ===== ERROR ANNOTATION (floating, connected by dashed lines) ===== -->
  <!-- Positioned in center between the vertical convergence lines -->
  <rect x="180" y="396" width="280" height="48" rx="5" fill="#fff8e1" stroke="#ffb300" stroke-width="1"/>
  <text x="320" y="417" text-anchor="middle" font-size="10.5" fill="#6d5600">With probability ε, the intended action</text>
  <text x="320" y="433" text-anchor="middle" font-size="10.5" fill="#6d5600">is reversed (noisy decision-making)</text>

  <!-- Dashed lines from convergence verticals to error box -->
  <line x1="160" y1="420" x2="180" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="480" y1="420" x2="460" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== FINAL CHOICE BOX ===== -->
  <rect x="195" y="536" width="250" height="42" rx="5" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="320" y="562" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Choice on trial t</text>

  <!-- ===== MATH SUMMARY BOX ===== -->
  <rect x="115" y="608" width="410" height="72" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="628" text-anchor="middle" font-size="11" fill="#444" font-weight="500">General formula:</text>
  <text x="320" y="648" text-anchor="middle" font-size="12.5" fill="#333" font-style="italic">P(yₜ = yₜ₋₁ | rₜ₋₁)  =  (1 − ε) · rₜ₋₁  +  ε/2</text>
  <text x="320" y="670" text-anchor="middle" font-size="10.5" fill="#888">When ε = 0:  P(yₜ = yₜ₋₁ | rₜ₋₁) = rₜ₋₁   (deterministic WSLS)</text>

  <!-- ===== LEGEND ===== -->
  <line x1="180" y1="712" x2="210" y2="712" stroke="#333" stroke-width="1.3"/>
  <text x="218" y="716" font-size="9.5" fill="#666">Decision flow</text>
  <line x1="370" y1="712" x2="400" y2="712" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="408" y="716" font-size="9.5" fill="#666">Error perturbation (ε)</text>
</svg>