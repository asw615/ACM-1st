<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 740" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <!-- Clean filled arrowhead -->
    <marker id="a" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1.5 L11,5 L0,8.5 Z" fill="#444"/>
    </marker>
    <!-- Blue arrowhead for loop -->
    <marker id="ab" markerWidth="14" markerHeight="11" refX="13" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1.5 L13,5.5 L0,9.5 Z" fill="#5c7cfa"/>
    </marker>
    <!-- Gradient for alpha bar -->
    <linearGradient id="alphaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="50%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="620" height="740" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="330" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a" letter-spacing="0.2">Rescorla-Wagner (RL) Model</text>

  <!-- ============================================ -->
  <!-- BOX 1: Estimated value Vt                    -->
  <!-- ============================================ -->
  <rect x="185" y="66" width="260" height="56" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.6"/>
  <text x="315" y="90" text-anchor="middle" font-size="13.5" font-weight="600" fill="#283593">Estimated value  Vₜ</text>
  <text x="315" y="110" text-anchor="middle" font-size="10.5" fill="#5c6bc0" font-style="italic">P(penny in right hand)</text>

  <!-- Initial value callout -->
  <rect x="462" y="72" width="118" height="28" rx="14" fill="#fff8e1" stroke="#ffc107" stroke-width="1"/>
  <text x="521" y="91" text-anchor="middle" font-size="10" fill="#7b6b00" font-weight="500">Initial: V₁ = 0.5</text>
  <line x1="462" y1="86" x2="447" y2="90" stroke="#ffc107" stroke-width="1"/>

  <!-- ARROW 1→2 -->
  <line x1="315" y1="122" x2="315" y2="156" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ============================================ -->
  <!-- BOX 2: Sample choice                         -->
  <!-- ============================================ -->
  <rect x="185" y="164" width="260" height="52" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.3"/>
  <text x="315" y="187" text-anchor="middle" font-size="12.5" fill="#222">Sample choice</text>
  <text x="315" y="206" text-anchor="middle" font-size="12" fill="#444" font-style="italic">aₜ  ~  Bernoulli(Vₜ)</text>

  <!-- Side note -->
  <text x="462" y="184" font-size="9" fill="#aaa" font-style="italic">aₜ ∈ {0, 1}</text>
  <text x="462" y="196" font-size="9" fill="#aaa" font-style="italic">1 = right,  0 = left</text>

  <!-- ARROW 2→3 -->
  <line x1="315" y1="216" x2="315" y2="250" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ============================================ -->
  <!-- BOX 3: Observe outcome                       -->
  <!-- ============================================ -->
  <rect x="185" y="258" width="260" height="52" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.3"/>
  <text x="315" y="281" text-anchor="middle" font-size="12.5" fill="#222">Observe outcome</text>
  <text x="315" y="300" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Rewardₜ ∈ {0, 1}   (win / loss)</text>

  <!-- ARROW 3→4 -->
  <line x1="315" y1="310" x2="315" y2="344" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ============================================ -->
  <!-- BOX 4: Prediction error                      -->
  <!-- ============================================ -->
  <rect x="155" y="352" width="320" height="52" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/>
  <text x="315" y="374" text-anchor="middle" font-size="12.5" fill="#222">Compute prediction error</text>
  <text x="315" y="394" text-anchor="middle" font-size="13" fill="#bf360c" font-style="italic">PE  =  Rewardₜ₋₁  −  Vₜ₋₁</text>

  <!-- ARROW 4→5 -->
  <line x1="315" y1="404" x2="315" y2="438" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ============================================ -->
  <!-- BOX 5: Update value (Delta Rule)             -->
  <!-- ============================================ -->
  <rect x="145" y="446" width="340" height="72" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="315" y="470" text-anchor="middle" font-size="12.5" font-weight="500" fill="#222">Update value  (Delta Rule)</text>
  <text x="315" y="494" text-anchor="middle" font-size="14" fill="#2e7d32" font-style="italic">Vₜ  =  Vₜ₋₁  +  α · PE</text>
  <text x="315" y="512" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">then clamp Vₜ to [0, 1]</text>

  <!-- ============================================ -->
  <!-- LOOP ARROW                                   -->
  <!-- Curves from left of Box 5 up to left of Box 1 -->
  <!-- ============================================ -->
  <path d="M145,482 C62,482 44,300 44,160 C44,72 110,58 183,82"
        fill="none" stroke="#5c7cfa" stroke-width="2.2" marker-end="url(#ab)"/>

  <!-- Loop label — rotated along the curve, left side, clear of the line -->
  <text x="30" y="310" text-anchor="middle" font-size="9.5" fill="#5c7cfa" font-weight="600" letter-spacing="1.5" transform="rotate(-90,30,310)">NEXT TRIAL</text>

  <!-- ============================================ -->
  <!-- PARAMETER BOX                                -->
  <!-- ============================================ -->
  <rect x="88" y="564" width="444" height="140" rx="10" fill="#fff" stroke="#e0e0e0" stroke-width="1.2"/>

  <!-- Header strip -->
  <clipPath id="headerClip">
    <rect x="88" y="564" width="444" height="34" rx="10"/>
  </clipPath>
  <rect x="88" y="564" width="444" height="40" fill="#f5f5f5" clip-path="url(#headerClip)"/>
  <line x1="88" y1="598" x2="532" y2="598" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="310" y="587" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333">Single free parameter:   α ∈ [0, 1]   (learning rate)</text>

  <!-- Gradient bar -->
  <rect x="118" y="616" width="384" height="12" rx="6" fill="url(#alphaGrad)" opacity="0.85"/>

  <!-- Tick marks -->
  <line x1="118" y1="614" x2="118" y2="630" stroke="#999" stroke-width="0.8"/>
  <line x1="310" y1="614" x2="310" y2="630" stroke="#999" stroke-width="0.8"/>
  <line x1="502" y1="614" x2="502" y2="630" stroke="#999" stroke-width="0.8"/>

  <!-- Scale numbers -->
  <text x="118" y="644" text-anchor="middle" font-size="10" fill="#444" font-weight="600">0</text>
  <text x="502" y="644" text-anchor="middle" font-size="10" fill="#444" font-weight="600">1</text>

  <!-- Three column descriptions -->
  <!-- Left -->
  <text x="118" y="664" text-anchor="start" font-size="10" fill="#555" font-weight="500">No learning</text>
  <text x="118" y="678" text-anchor="start" font-size="9" fill="#999">Always random</text>
  <text x="118" y="690" text-anchor="start" font-size="9" fill="#999">(V stays at 0.5)</text>

  <!-- Center -->
  <text x="310" y="664" text-anchor="middle" font-size="10" fill="#555" font-weight="500">Gradual learning</text>
  <text x="310" y="678" text-anchor="middle" font-size="9" fill="#999">Long memory,</text>
  <text x="310" y="690" text-anchor="middle" font-size="9" fill="#999">smooth updates</text>

  <!-- Right -->
  <text x="502" y="664" text-anchor="end" font-size="10" fill="#555" font-weight="500">Maximally reactive</text>
  <text x="502" y="678" text-anchor="end" font-size="9" fill="#999">V jumps to</text>
  <text x="502" y="690" text-anchor="end" font-size="9" fill="#999">last outcome</text>

  <!-- ============================================ -->
  <!-- LEGEND                                       -->
  <!-- ============================================ -->
  <line x1="180" y1="722" x2="210" y2="722" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="220" y="726" font-size="9.5" fill="#888">Sequential flow</text>
  <line x1="370" y1="722" x2="400" y2="722" stroke="#5c7cfa" stroke-width="2.2" marker-end="url(#ab)"/>
  <text x="410" y="726" font-size="9.5" fill="#888">Learning loop</text>
</svg>